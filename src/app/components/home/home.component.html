<!-- ===== HOME BANNER SLIDER ===== -->
<section class="home-slider-section">

    <!-- Slider — shows when banners load -->
    <div class="slider-wrapper" *ngIf="activeBanners.length > 0"
        (mouseenter)="stopAutoPlay()" (mouseleave)="startAutoPlay()">

        <div class="slider-track">
            <div class="slide" *ngFor="let banner of activeBanners; let i = index"
                [class.active]="i === currentSlide"
                [class.has-link]="banner.redirectionUrl"
                (click)="openRedirection(banner)">
                <img *ngIf="banner.type === 'image'"
                    [src]="banner.url" [alt]="'Banner ' + (i + 1)"
                    class="slide-media slide-image" loading="lazy" />
                <video *ngIf="banner.type === 'video'"
                    class="slide-media slide-video"
                    [src]="banner.url" [muted]="true" autoplay loop playsinline preload="auto"
                    (canplay)="onVideoCanPlay($event)">
                </video>
            </div>
        </div>

        <ng-container *ngIf="activeBanners.length > 1">
            <button class="slider-arrow prev" (click)="prevSlide(); $event.stopPropagation()" aria-label="Previous">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="slider-arrow next" (click)="nextSlide(); $event.stopPropagation()" aria-label="Next">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <div class="slider-dots">
                <button class="dot" *ngFor="let banner of activeBanners; let i = index"
                    [class.active]="i === currentSlide"
                    (click)="goToSlide(i); $event.stopPropagation()"
                    [attr.aria-label]="'Go to slide ' + (i + 1)">
                </button>
            </div>
        </ng-container>

    </div>

</section>

<!-- ===== BRANDS MARQUEE ===== -->
<section class="brands-marquee-section" aria-label="Featured Brands">
    <div class="marquee-track-wrapper" *ngIf="marqueebrands.length > 0">
        <div class="marquee-track" [style.animation-duration]="marqueeDuration + 's'">
            <!-- Set 1 -->
            <ng-container *ngFor="let brand of marqueebrands">
                <a class="marquee-item" [routerLink]="['/shop']" [queryParams]="{brandId: brand.id}" [title]="brand.name">
                    {{ brand.name | uppercase }}
                </a>
                <span class="marquee-dot" aria-hidden="true">·</span>
            </ng-container>
            <!-- Set 2 — exact duplicate for seamless infinite loop -->
            <ng-container *ngFor="let brand of marqueebrands">
                <a class="marquee-item" [routerLink]="['/shop']" [queryParams]="{brandId: brand.id}" [title]="brand.name" tabindex="-1" aria-hidden="true">
                    {{ brand.name | uppercase }}
                </a>
                <span class="marquee-dot" aria-hidden="true">·</span>
            </ng-container>
        </div>
    </div>
</section>

<!-- ===== APP DOWNLOAD STRIP ===== -->
<section class="app-strip-section">
    <div class="app-strip-inner">

        <!-- QR Code -->
        <div class="app-strip-qr">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=https://www.next.co.uk/x/apps&bgcolor=ede8e0&color=1c1c1c&margin=0"
                alt="QR Code to download the app" />
        </div>

        <!-- Title -->
        <div class="app-strip-title">THE NEXT APP</div>

        <!-- Divider (desktop only) -->
        <div class="app-strip-divider"></div>

        <!-- Description -->
        <div class="app-strip-desc">
            Available in the App Store or Google Play Store &ndash;
            Scan the QR code to download the Next App
        </div>

        <!-- Store Badges -->
        <div class="app-strip-badges">
            <a href="https://apps.apple.com" target="_blank" rel="noopener" class="store-badge" aria-label="Download on the App Store">
                <span class="store-badge-icon"><span><i class="fa-brands fa-apple"></i></span></span>
                <span class="store-badge-text">
                    <span class="store-badge-sub">Download on the</span>
                    <span class="store-badge-name">App Store</span>
                </span>
            </a>
            <a href="https://play.google.com" target="_blank" rel="noopener" class="store-badge" aria-label="Get it on Google Play">
                <span class="store-badge-icon"><span><i class="fa-brands fa-google-play"></i></span></span>
                <span class="store-badge-text">
                    <span class="store-badge-sub">Get it on</span>
                    <span class="store-badge-name">Google Play</span>
                </span>
            </a>
        </div>

    </div>
</section>

<!-- ===== PROMO BANNERS (3 rows: 1-2-1 columns) ===== -->
<section class="promo-section" *ngIf="promoRows.length > 0">
    <div class="promo-row" *ngFor="let row of promoRows; let ri = index"
        [class.promo-row-1]="row.length === 1"
        [class.promo-row-2]="row.length === 2">
        <div class="promo-cell" *ngFor="let cell of row; let ci = index"
            [class.promo-cell-clickable]="cell?.redirectionUrl"
            [class.promo-cell-empty]="!cell?.url"
            (click)="cell?.redirectionUrl ? openPromoLink(cell) : null">
            <!-- Has media -->
            <img *ngIf="cell?.url" [src]="cell.url" [alt]="cell.label || 'Promo'" class="promo-media" loading="lazy" />
            <!-- Empty slot -->
            <div class="promo-empty" *ngIf="!cell?.url"></div>
            <!-- Label overlay -->
            <div class="promo-label" *ngIf="cell?.label">{{ cell.label }}</div>
        </div>
    </div>
</section>

<!-- ===== BRANDS GRID ===== -->
<section class="brands-grid-section" *ngIf="brandRows.length > 0">
    <div class="brands-grid-row" *ngFor="let row of brandRows">
        <div class="brands-grid-row-label">{{row.label}}</div>
        <div class="brands-grid-row-cards">
            <a *ngFor="let brand of row.brands"
                class="brand-card"
                [routerLink]="['/shop']"
                [queryParams]="{brandId: brand.id}"
                [title]="brand.name">
                <!-- BG image or fallback grey -->
                <div class="brand-card-bg"
                    [style.background-image]="brand.image ? 'url(' + brand.image + ')' : 'none'"
                    [style.background-color]="brand.image ? 'transparent' : '#d8d8d8'">
                </div>
                <!-- Overlay -->
                <div class="brand-card-overlay"></div>
                <!-- Name -->
                <span class="brand-card-name">{{brand.name | uppercase}}</span>
            </a>
        </div>
    </div>
</section>
